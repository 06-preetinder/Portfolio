<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="space-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#120c1f" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#05030a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <!-- Photon ring glow -->
    <radialGradient id="photon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#f6c177" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#c4a7e7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c4a7e7" stop-opacity="0"/>
    </radialGradient>

    <!-- Accretion disk gradient -->
    <linearGradient id="disk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#f6c177" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#c4a7e7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#31748f" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes galaxy-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .spin-group {
        transform-origin: 32px 32px;
        animation: galaxy-spin 10s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .spin-group { animation: none; }
      }
    </style>
  </defs>

  <!-- Deep cosmic circular background -->
  <circle cx="32" cy="32" r="31" fill="url(#space-glow)" stroke="#c4a7e7" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Rotating Galaxy / Accretion Disk Group -->
  <g class="spin-group">
    <!-- Outer faint dust arms -->
    <path d="M 32 32 Q 48 16 54 28 Q 58 38 48 48 Q 38 56 26 52 Q 12 48 10 34 Q 8 20 22 12 Q 34 6 46 14"
          fill="none" stroke="#c4a7e7" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.35" filter="url(#glow)"/>

    <!-- Main Spiral Arm 1 -->
    <path d="M 32 32 C 40 24 50 26 53 34 C 55 42 46 50 36 50 C 24 50 16 40 17 28 C 18 18 28 12 38 13 C 46 14 52 20 54 26"
          fill="none" stroke="url(#disk-grad)" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.85" filter="url(#glow)"/>

    <!-- Main Spiral Arm 2 (Symmetric opposite) -->
    <path d="M 32 32 C 24 40 14 38 11 30 C 9 22 18 14 28 14 C 40 14 48 24 47 36 C 46 46 36 52 26 51 C 18 50 12 44 10 38"
          fill="none" stroke="url(#disk-grad)" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.85" filter="url(#glow)"/>

    <!-- Inner tight relativistic accretion stream -->
    <ellipse cx="32" cy="32" rx="15" ry="7" transform="rotate(-28 32 32)"
             fill="none" stroke="#f6c177" stroke-width="2" stroke-opacity="0.9" filter="url(#glow)"/>

    <!-- Relativistic Doppler brighter arc -->
    <path d="M 18 25 A 15 7 0 0 1 45 22" transform="rotate(-28 32 32)"
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Luminous celestial particle stars in orbit -->
    <circle cx="48" cy="22" r="1.2" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="16" cy="42" r="1.1" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="20" cy="18" r="0.9" fill="#c4a7e7"/>
    <circle cx="44" cy="46" r="0.9" fill="#f6c177"/>
    <circle cx="53" cy="38" r="0.8" fill="#e0def4"/>
    <circle cx="11" cy="26" r="0.8" fill="#9ccfd8"/>

    <!-- Native SVG SMIL animateTransform for standalone SVG viewers / browsers supporting SMIL favicons -->
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- Gravitational Lensing Photon Ring Glow -->
  <circle cx="32" cy="32" r="10" fill="url(#photon-glow)" filter="url(#glow)"/>

  <!-- Crisp Photon Ring Border -->
  <circle cx="32" cy="32" r="7.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.95"/>

  <!-- Event Horizon (The Black Hole Singularity Void) -->
  <circle cx="32" cy="32" r="6.5" fill="#020204"/>
</svg>